name: Publish accepted release

on:
  push:
    branches:
      - main
    paths:
      - 'release/accepted.json'
      - 'release/notes.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-accepted-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Read manifest
        id: release
        shell: bash
        run: |
          set -euo pipefail
          manifest='release/accepted.json'
          for key in version tag title source_sha run_id artifact_name asset_name sha256; do
            value="$(jq -r --arg key "$key" '.[$key]' "$manifest")"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "Missing release manifest field: $key" >&2
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
          python3 - <<'PY'
          import json, re, xml.etree.ElementTree as ET
          manifest = json.load(open('release/accepted.json'))
          version = ET.parse('BetterSaveSoulRebalance.csproj').findtext('.//Version')
          plugin = re.search(r'PluginVersion = "([^"]+)"', open('src/SoulDLCRebalancePlugin.cs').read()).group(1)
          assert manifest['version'] == version == plugin
          assert manifest['tag'] == 'v' + version
          assert manifest['artifact_name'] == 'BetterSaveSoulRebalance-' + version
          assert manifest['asset_name'] == 'BetterSaveSoulRebalance-' + version + '.dll'
          assert re.fullmatch(r'[0-9a-f]{40}', manifest['source_sha'])
          assert re.fullmatch(r'[0-9a-f]{64}', manifest['sha256'])
          print('Release version identity verified:', version)
          PY

      - name: Download accepted Actions artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: release-asset
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.run_id }}

      - name: Verify exact accepted DLL
        shell: bash
        run: |
          set -euo pipefail
          asset="release-asset/${{ steps.release.outputs.asset_name }}"
          test -f "$asset"
          actual="$(sha256sum "$asset" | awk '{print $1}')"
          expected='${{ steps.release.outputs.sha256 }}'
          if [ "$actual" != "$expected" ]; then
            echo "SHA-256 mismatch: expected $expected, got $actual" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ steps.release.outputs.tag }}'
          asset="release-asset/${{ steps.release.outputs.asset_name }}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi

          gh release create "$tag" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --target '${{ steps.release.outputs.source_sha }}' \
            --title '${{ steps.release.outputs.title }}' \
            --notes-file release/notes.md
