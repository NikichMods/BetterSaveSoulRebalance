name: Build Better Save Soul Rebalance

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev/**'
    paths:
      - 'src/**'
      - 'BetterSaveSoulRebalance.csproj'
      - 'nuget.config'
      - '.github/workflows/build.yml'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: better-save-soul-rebalance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify source and version identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 - <<'PY'
          import re, xml.etree.ElementTree as ET
          source = open('src/SoulDLCRebalancePlugin.cs').read()
          plugin = re.search(r'PluginVersion = "([^"]+)"', source).group(1)
          project = ET.parse('BetterSaveSoulRebalance.csproj').findtext('.//Version')
          assert plugin == project, (plugin, project)
          print('Verified version:', plugin)
          PY

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore BetterSaveSoulRebalance.csproj --configfile nuget.config

      - name: Build Release DLL
        run: dotnet build BetterSaveSoulRebalance.csproj -c Release --no-restore

      - name: Verify payment policy and native continuations
        run: dotnet run --project tests/PaymentTests.csproj -c Release

      - name: Read version and stage artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*PluginVersion = "\([^"]*\)".*/\1/p' src/SoulDLCRebalancePlugin.cs | head -n1)"
          test -n "$version"
          mkdir -p dist
          asset="BetterSaveSoulRebalance-$version.dll"
          cp bin/Release/BetterSaveSoulRebalance.dll "dist/$asset"
          hash="$(sha256sum "dist/$asset" | awk '{print $1}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "Better Save Soul Rebalance $version SHA-256: $hash"

      - name: Upload versioned DLL
        uses: actions/upload-artifact@v4
        with:
          name: BetterSaveSoulRebalance-${{ steps.artifact.outputs.version }}
          path: dist/${{ steps.artifact.outputs.asset }}
          if-no-files-found: error
          retention-days: 7
